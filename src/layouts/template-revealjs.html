</head>

<body>
$for(include-before)$
  $include-before$
$endfor$

<div class="reveal">

<!-- Any section element inside of this container is displayed as a slide -->
<div class="slides">

<section>
<h1>$title$</h1>
$for(author)$<h3>$author$</h3>$endfor$
<p>
<h4>$date$</h4>
</p>
</section>  

$if(toc)$
<section>
<h2>Outline</h2>
<nav id="$idprefix$TOC">
$toc$
</nav>
</section>
$endif$

$body$
</div>

<script src="https://csit.kutztown.edu/~earl/s/share/revealjs/dist/reveal.js"></script>
<script src="https://csit.kutztown.edu/~earl/s/share/revealjs/plugin/markdown/markdown.js"></script>

<script>
// More info about initialization & config:
// - https://revealjs.com/initialization/
// - https://revealjs.com/config/
  Reveal.initialize({
    controls: true,
    progress: true,
    history: true,
    center: false,

    hash: true,

    //plugins: [ RevealMarkdown, RevealHighlight, PdfExport ]
    plugins: [ RevealMarkdown, PdfExport ]
  });

</script>
